<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="hf-glow" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinyl-disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="25%" stop-color="#09090B"/>
      <stop offset="45%" stop-color="#18181B"/>
      <stop offset="65%" stop-color="#09090B"/>
      <stop offset="85%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="sleeve-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF1E42"/>
    </linearGradient>
    <filter id="vinyl-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#070709"/>
  <rect width="800" height="600" fill="url(#hf-glow)"/>

  <!-- Equalizer Background Waves -->
  <g opacity="0.1" stroke="#FF007F" stroke-width="1">
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Header -->
  <text x="60" y="50" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#FF007F" letter-spacing="3">05 // MUSIC CREATIVE DIRECTION & SOUNDTRACK</text>
  <text x="740" y="50" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#FFFFFF" letter-spacing="2" text-anchor="end">HF RECORD // ARTRAW</text>

  <!-- 12" Vinyl Disc slipping out to the right -->
  <g transform="translate(480, 290)">
    <!-- Outer Vinyl Body -->
    <circle cx="0" cy="0" r="175" fill="url(#vinyl-disc)" stroke="#27272A" stroke-width="2" filter="url(#vinyl-bloom)"/>
    <!-- Grooves -->
    <circle cx="0" cy="0" r="155" fill="none" stroke="#27272A" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="0" r="135" fill="none" stroke="#3F3F46" stroke-width="0.8" opacity="0.5"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#27272A" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#3F3F46" stroke-width="0.8" opacity="0.5"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#27272A" stroke-width="1" opacity="0.6"/>

    <!-- Light reflection shine on vinyl -->
    <path d="M -150 -60 Q 0 0, 150 60" stroke="#FFFFFF" stroke-width="2" opacity="0.12" fill="none"/>
    <path d="M -60 -150 Q 0 0, 60 150" stroke="#FFFFFF" stroke-width="2" opacity="0.12" fill="none"/>

    <!-- Center Label -->
    <circle cx="0" cy="0" r="55" fill="#FF007F"/>
    <circle cx="0" cy="0" r="50" fill="#0D0D14" stroke="#FF007F" stroke-width="2"/>
    <text y="-8" font-family="'Outfit', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">HF RECORD</text>
    <text y="8" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#00F0FF" text-anchor="middle">33 ⅓ RPM · STEREO</text>
    <!-- Center spindle hole -->
    <circle cx="0" cy="0" r="6" fill="#070709" stroke="#52525B" stroke-width="1"/>
  </g>

  <!-- Album Sleeve Jacket (Left Front) -->
  <g transform="translate(100, 100)">
    <!-- Jacket Outer Box -->
    <rect width="360" height="360" rx="14" fill="#0E0E14" stroke="url(#sleeve-border)" stroke-width="2" filter="url(#vinyl-bloom)"/>
    
    <!-- Sleeve Inner Graphic Artwork -->
    <rect x="20" y="20" width="320" height="320" rx="10" fill="#070709" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Big Bold Title inside Sleeve -->
    <g transform="translate(40, 60)">
      <text y="0" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#00F0FF" letter-spacing="3">CATALOGUE #HF-001</text>
      <text y="42" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-1">HF RECORD</text>
      <text y="68" font-family="'Playfair Display', serif" font-style="italic" font-size="18" fill="#FF007F">Master Visual Release</text>
      
      <!-- Audio Waveform Graphic on Sleeve -->
      <g transform="translate(0, 100)">
        <path d="M 0 40 Q 20 0, 40 40 T 80 40 T 120 10 T 160 60 T 200 40 T 240 40" fill="none" stroke="#FF007F" stroke-width="2.5"/>
        <path d="M 0 40 Q 20 20, 40 40 T 80 50 T 120 20 T 160 45 T 200 40 T 240 40" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.6"/>
      </g>

      <!-- Stereo VU Meter Bars -->
      <g transform="translate(0, 180)">
        <text y="0" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#71717A">AUDIO MASTER PEAK [L/R]:</text>
        <rect y="10" width="220" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
        <rect y="10" width="180" height="8" rx="4" fill="linear-gradient(90deg, #22C55E 60%, #EAB308 85%, #FF007F 100%)"/>
        
        <rect y="24" width="220" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
        <rect y="24" width="165" height="8" rx="4" fill="linear-gradient(90deg, #22C55E 60%, #EAB308 85%, #FF007F 100%)"/>
      </g>
    </g>

    <!-- Parental / Studio Advisory Badge -->
    <rect x="250" y="295" width="80" height="32" rx="4" fill="#000000" stroke="#FFFFFF" stroke-width="1"/>
    <text x="290" y="312" font-family="'Outfit', sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">ARTRAW</text>
    <text x="290" y="322" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#A1A1AA" text-anchor="middle">STUDIO MASTER</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="60" y="525" width="680" height="42" rx="8" fill="rgba(13,13,18,0.9)" stroke="rgba(255,0,127,0.3)" stroke-width="1"/>
  <text x="85" y="551" font-family="'Outfit', sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">HF RECORD // MUSIC & ARTIST CREATIVE DIRECTION</text>
  <text x="715" y="551" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#FF007F" text-anchor="end" letter-spacing="2">AUTHENTIC DIRECTION</text>
</svg>
