<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="lucy-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D0D14"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <filter id="cyan-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="#070709"/>
  <rect width="800" height="600" fill="url(#lucy-glow)"/>

  <!-- Technical Grid Overlay -->
  <g opacity="0.12" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
  </g>

  <!-- Technical Annotations -->
  <text x="40" y="50" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#00F0FF" letter-spacing="3" opacity="0.8">01 // NEURAL ASSISTANT POSTER</text>
  <text x="760" y="50" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#A1A1AA" letter-spacing="2" text-anchor="end" opacity="0.6">ANDROID / KOTLIN CORE</text>

  <!-- Smartphone Mockup Chassis -->
  <g transform="translate(250, 60)">
    <!-- Outer Phone Shadow & Glow -->
    <rect x="-10" y="-10" width="320" height="490" rx="42" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.3" filter="url(#cyan-bloom)"/>
    <!-- Outer Phone Body -->
    <rect x="0" y="0" width="300" height="470" rx="36" fill="#121218" stroke="url(#phone-rim)" stroke-width="2"/>
    <!-- Inner Screen Bezel -->
    <rect x="10" y="10" width="280" height="450" rx="28" fill="url(#screen-grad)"/>

    <!-- Dynamic Island / Speaker Pill -->
    <rect x="105" y="18" width="90" height="20" rx="10" fill="#000000" stroke="#00F0FF" stroke-width="1" opacity="0.6"/>
    <circle cx="178" cy="28" r="4" fill="#00F0FF" opacity="0.8"/>

    <!-- Screen Status Bar -->
    <text x="32" y="32" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#A1A1AA" font-weight="bold">9:41</text>
    <text x="250" y="32" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#00F0FF" text-anchor="end">5G · 100%</text>

    <!-- App Header -->
    <text x="150" y="75" font-family="'Outfit', sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" letter-spacing="2">LUCY NEURAL AI</text>
    <text x="150" y="92" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#00F0FF" text-anchor="middle" letter-spacing="1">ON-DEVICE RUNTIME ACTIVE</text>

    <!-- Voice Waveform Card -->
    <rect x="25" y="115" width="250" height="150" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(0,240,255,0.25)" stroke-width="1"/>
    
    <!-- Spectrogram Wave Lines -->
    <path d="M 40 190 Q 60 140, 80 190 T 120 190 T 160 160 T 200 220 T 240 190 T 260 190" fill="none" stroke="url(#wave-grad)" stroke-width="3" filter="url(#cyan-bloom)"/>
    <path d="M 40 190 Q 60 160, 80 190 T 120 200 T 160 140 T 200 200 T 240 190 T 260 190" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.6"/>

    <!-- Pulse Bars -->
    <g transform="translate(60, 220)" fill="#00F0FF" opacity="0.85">
      <rect x="0" y="-15" width="4" height="25" rx="2"/>
      <rect x="12" y="-30" width="4" height="40" rx="2" fill="#FF007F"/>
      <rect x="24" y="-8" width="4" height="18" rx="2"/>
      <rect x="36" y="-22" width="4" height="32" rx="2"/>
      <rect x="48" y="-35" width="4" height="45" rx="2" fill="#FF007F"/>
      <rect x="60" y="-12" width="4" height="22" rx="2"/>
      <rect x="72" y="-26" width="4" height="36" rx="2"/>
      <rect x="84" y="-18" width="4" height="28" rx="2"/>
      <rect x="96" y="-32" width="4" height="42" rx="2" fill="#FF007F"/>
      <rect x="108" y="-10" width="4" height="20" rx="2"/>
      <rect x="120" y="-28" width="4" height="38" rx="2"/>
      <rect x="132" y="-14" width="4" height="24" rx="2"/>
      <rect x="144" y="-30" width="4" height="40" rx="2"/>
      <rect x="156" y="-8" width="4" height="18" rx="2"/>
    </g>

    <!-- User Command Bubble -->
    <rect x="25" y="280" width="250" height="52" rx="12" fill="rgba(0,240,255,0.08)" stroke="rgba(0,240,255,0.3)" stroke-width="1"/>
    <text x="38" y="302" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#00F0FF">> lucy.dispatch("local_llm")</text>
    <text x="38" y="318" font-family="'Outfit', sans-serif" font-size="11" fill="#FFFFFF">"Synthesizing prompt on device..."</text>

    <!-- Telemetry HUD Footer -->
    <g transform="translate(25, 348)">
      <rect width="250" height="85" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="14" y="24" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#A1A1AA">ENGINE: ON-DEVICE KOTLIN</text>
      <text x="14" y="44" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#A1A1AA">INFERENCE LATENCY: <tspan fill="#00F0FF" font-weight="bold">18ms</tspan></text>
      <text x="14" y="64" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#A1A1AA">CONTEXT WINDOW: <tspan fill="#FF007F" font-weight="bold">8,192 TOKENS</tspan></text>
      <circle cx="230" cy="24" r="5" fill="#00F0FF" filter="url(#cyan-bloom)"/>
    </g>
  </g>

  <!-- Left Side Badges & Banners -->
  <g transform="translate(40, 160)">
    <rect width="170" height="44" rx="22" fill="rgba(13,13,18,0.85)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
    <circle cx="24" cy="22" r="6" fill="#00F0FF"/>
    <text x="42" y="26" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#FFFFFF" font-weight="bold">AUTONOMOUS</text>

    <rect y="64" width="170" height="44" rx="22" fill="rgba(13,13,18,0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="24" cy="86" r="6" fill="#FF007F"/>
    <text x="42" y="90" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#FFFFFF" font-weight="bold">OFFLINE FIRST</text>

    <rect y="128" width="170" height="44" rx="22" fill="rgba(13,13,18,0.85)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
    <circle cx="24" cy="150" r="6" fill="#00F0FF"/>
    <text x="42" y="154" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#FFFFFF" font-weight="bold">LOCAL WEIGHTS</text>
  </g>

  <!-- Right Side Architectural Node Diagram -->
  <g transform="translate(590, 160)">
    <rect width="170" height="220" rx="16" fill="rgba(13,13,18,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="20" y="32" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#00F0FF" font-weight="bold">STACK DIAGRAM</text>
    
    <rect x="20" y="50" width="130" height="32" rx="6" fill="rgba(0,240,255,0.12)" stroke="#00F0FF" stroke-width="1"/>
    <text x="85" y="70" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">lucyai-app (UI)</text>
    
    <line x1="85" y1="82" x2="85" y2="102" stroke="#00F0FF" stroke-dasharray="2,2"/>
    
    <rect x="20" y="102" width="130" height="32" rx="6" fill="rgba(255,0,127,0.12)" stroke="#FF007F" stroke-width="1"/>
    <text x="85" y="122" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">Assistant Kernel</text>
    
    <line x1="85" y1="134" x2="85" y2="154" stroke="#FF007F" stroke-dasharray="2,2"/>
    
    <rect x="20" y="154" width="130" height="32" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="85" y="174" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#A1A1AA" text-anchor="middle">Local GGUF / NPU</text>
  </g>

  <!-- Bottom Brand Banner -->
  <rect x="40" y="530" width="720" height="40" rx="8" fill="rgba(13,13,18,0.9)" stroke="rgba(0,240,255,0.3)" stroke-width="1"/>
  <text x="60" y="555" font-family="'Outfit', sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" letter-spacing="1">LUCY AI // ANDROID EDGE ASSISTANT</text>
  <text x="740" y="555" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#00F0FF" text-anchor="end" letter-spacing="2">AUTHENTIC ARTRAW REPOSITORY</text>
</svg>
