<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="openclaw-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#00F0FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cli-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="magenta-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="800" height="600" fill="#070709"/>
  <rect width="800" height="600" fill="url(#openclaw-glow)"/>

  <!-- Matrix Grid -->
  <g opacity="0.1" stroke="#FF007F" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
  </g>

  <!-- Header Annotations -->
  <text x="40" y="50" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#FF007F" letter-spacing="3" opacity="0.9">02 // AI ROUTING INFRASTRUCTURE</text>
  <text x="760" y="50" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#00F0FF" letter-spacing="2" text-anchor="end" opacity="0.8">OPENCLAW · OMNIROUTE</text>

  <!-- Central CLI Terminal Window -->
  <g transform="translate(60, 80)">
    <!-- Terminal Outer Frame -->
    <rect width="680" height="420" rx="16" fill="#0D0D14" stroke="url(#cli-border)" stroke-width="2" filter="url(#magenta-bloom)"/>
    
    <!-- Titlebar -->
    <rect width="680" height="40" rx="16" fill="rgba(255,255,255,0.04)"/>
    <circle cx="25" cy="20" r="6" fill="#FF1E42"/>
    <circle cx="45" cy="20" r="6" fill="#EAB308"/>
    <circle cx="65" cy="20" r="6" fill="#00F0FF"/>
    <text x="340" y="25" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#A1A1AA" text-anchor="middle">omniroute-ctl — termux@localhost:8080</text>

    <!-- CLI Code Output -->
    <g transform="translate(30, 70)" font-family="'IBM Plex Mono', monospace" font-size="13">
      <text y="0" fill="#00F0FF">> openclaw-ctl --daemon --route-engine omniroute</text>
      <text y="24" fill="#A1A1AA">[INFO] Initializing OmniRoute model dispatch substrate...</text>
      <text y="48" fill="#22C55E">✓ Connection established on unix:///data/local/tmp/omniroute.sock</text>
      <text y="72" fill="#FF007F">⚡ Active Route Matrix: LOCAL_GGUF (P0) → HYBRID_API (P1) → FAILOVER (P2)</text>
      
      <!-- Interactive Diagram Box inside Terminal -->
      <g transform="translate(0, 100)">
        <rect width="620" height="150" rx="10" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        
        <!-- Node 1: Request -->
        <rect x="25" y="45" width="110" height="60" rx="8" fill="rgba(0,240,255,0.12)" stroke="#00F0FF" stroke-width="1.5"/>
        <text x="80" y="72" fill="#00F0FF" font-size="11" text-anchor="middle" font-weight="bold">INPUT</text>
        <text x="80" y="90" fill="#FFFFFF" font-size="10" text-anchor="middle">Prompt Queue</text>
        
        <!-- Arrow 1 -->
        <line x1="135" y1="75" x2="195" y2="75" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrow)"/>
        
        <!-- Node 2: OmniRoute Engine -->
        <rect x="195" y="30" width="190" height="90" rx="10" fill="rgba(255,0,127,0.15)" stroke="#FF007F" stroke-width="2"/>
        <text x="290" y="60" fill="#FF007F" font-size="12" text-anchor="middle" font-weight="bold">OMNIROUTE CORE</text>
        <text x="290" y="80" fill="#FFFFFF" font-size="10" text-anchor="middle">Dynamic Classifier</text>
        <text x="290" y="100" fill="#A1A1AA" font-size="9" text-anchor="middle">Latency: 14ms · Weight: Local</text>
        
        <!-- Arrows to split targets -->
        <line x1="385" y1="60" x2="445" y2="45" stroke="#FF007F" stroke-width="1.5"/>
        <line x1="385" y1="90" x2="445" y2="105" stroke="#00F0FF" stroke-width="1.5"/>
        
        <!-- Node 3A: Edge Model -->
        <rect x="445" y="20" width="150" height="45" rx="6" fill="rgba(255,255,255,0.05)" stroke="#00F0FF" stroke-width="1"/>
        <text x="520" y="42" fill="#00F0FF" font-size="10" text-anchor="middle">Local On-Device LLM</text>
        <text x="520" y="56" fill="#22C55E" font-size="8" text-anchor="middle">ACTIVE · 0ms CLOUD WAIT</text>
        
        <!-- Node 3B: Remote Proxy -->
        <rect x="445" y="85" width="150" height="45" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <text x="520" y="107" fill="#A1A1AA" font-size="10" text-anchor="middle">External Fallback API</text>
        <text x="520" y="121" fill="#FFB800" font-size="8" text-anchor="middle">STANDBY MODE</text>
      </g>

      <text y="280" fill="#22C55E">>>> omniroute daemon listening on port 8080... [LOCK 60FPS METRICS OK]</text>
      <text y="304" fill="#A1A1AA">Real scripts: openclaw-ctl, omniroute-ctl (Autonomous CLI)</text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <rect x="60" y="525" width="680" height="42" rx="8" fill="rgba(13,13,18,0.9)" stroke="rgba(255,0,127,0.3)" stroke-width="1"/>
  <text x="85" y="551" font-family="'Outfit', sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">OPENCLAW / OMNIROUTE // LOCAL AI RUNTIME</text>
  <text x="715" y="551" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#FF007F" text-anchor="end" letter-spacing="2">AUTHENTIC TOOLING</text>
</svg>
